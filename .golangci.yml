version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocyclo
    - misspell
    - nilerr
    - unconvert
    - usestdlibvars
  settings:
    gocyclo:
      min-complexity: 15
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gocyclo

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Tobias-Braun/brooom
