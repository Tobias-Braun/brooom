# Validates the release pipeline on pull requests that touch it. Nothing is
# uploaded or published and the token is read-only.
name: Release check

on:
  pull_request:
    paths:
      - .goreleaser.yaml
      - .github/workflows/release*.yml
      - scripts/install.*
      - scripts/test-install.sh
      - scripts/test-install.ps1
      - scripts/smoke-darwin.sh
      # The shipped macOS binary reaches the Trash through purego.
      - internal/trash/**
      - go.mod
      - go.sum
      - docs/releasing.md

permissions:
  contents: read

concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  goreleaser:
    name: GoReleaser snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
      - name: Snapshot binary reports the stamped version
        run: |
          ./dist/brooom_linux_amd64_v1/brooom version --format plain | grep -q SNAPSHOT
      # The macOS and Windows jobs below smoke-test the real snapshot archives.
      - uses: actions/upload-artifact@v4
        with:
          name: snapshot-dist
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          retention-days: 3

  smoke-darwin:
    name: Smoke darwin/${{ matrix.arch }}
    needs: goreleaser
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-15-intel
            arch: amd64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: snapshot-dist
          path: dist
      - name: Unpack the snapshot binary
        run: |
          mkdir bin
          tar -xzf dist/brooom_*_darwin_${{ matrix.arch }}.tar.gz -C bin brooom
          file bin/brooom
      - name: Version, sweep and Trash run
        run: sh scripts/smoke-darwin.sh bin/brooom

  install-ps1:
    name: install.ps1 (${{ matrix.shell }})
    needs: goreleaser
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: snapshot-dist
          path: dist
      # The shell key is not expression-evaluated, so each shell gets literal
      # steps guarded by the matrix value.
      - name: Install the snapshot with Windows PowerShell 5.1
        if: matrix.shell == 'powershell'
        shell: powershell
        run: ./scripts/test-install.ps1 -DistDir dist
      - name: Install the snapshot with PowerShell 7
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: ./scripts/test-install.ps1 -DistDir dist
      - name: Install against a fake release with Windows PowerShell 5.1
        if: matrix.shell == 'powershell'
        shell: powershell
        run: ./scripts/test-install.ps1
      - name: Install against a fake release with PowerShell 7
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: ./scripts/test-install.ps1

  install-script:
    name: Install script (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Syntax check
        run: sh -n scripts/install.sh
      - name: ShellCheck
        if: runner.os == 'Linux'
        run: shellcheck scripts/install.sh scripts/test-install.sh
      - name: Install against a local fake release
        run: sh scripts/test-install.sh
