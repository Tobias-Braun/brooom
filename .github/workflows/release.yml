# Publishes a GitHub release when a version tag is pushed (docs/releasing.md).
# HOMEBREW_TAP_GITHUB_TOKEN is required for stable releases, because the
# Homebrew cask is published. The other package manager tokens are optional:
# while their integrations keep skip_upload: true in .goreleaser.yaml the
# values are unused, and an unset secret simply expands to an empty string.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Tagged commit is on main
        # Releases are cut from main only (docs/releasing.md); a tag on a
        # side branch must not publish anything.
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not reachable from origin/main; refusing to release"
            exit 1
          fi
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
