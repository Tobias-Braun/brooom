name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: go vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # The test output is also kept in a file so the step below can repeat
      # the failures at the end of the log: the verbose Windows output is
      # longer than the log tail the GitHub API returns, which otherwise hides
      # the failing package. bash runs with -eo pipefail, so go test's exit
      # status still decides the step.
      - name: Test (race)
        if: runner.os != 'Windows'
        shell: bash
        run: go test -race -count=1 ./... 2>&1 | tee "$RUNNER_TEMP/go-test.log"
      - name: Test
        if: runner.os == 'Windows'
        shell: bash
        run: go test -count=1 -v -timeout 8m ./... 2>&1 | tee "$RUNNER_TEMP/go-test.log"
      - name: Summarize failed tests
        if: failure()
        shell: bash
        run: |
          log="$RUNNER_TEMP/go-test.log"
          [ -f "$log" ] || exit 0
          echo "::group::Failed tests and packages"
          grep -E -B 20 -A 5 '^[[:space:]]*--- FAIL|^FAIL|^panic:|^fatal error:' "$log" | head -n 600 || true
          echo "::endgroup::"

  # Releases are built with CGO_ENABLED=0, where macOS reaches the Trash through
  # purego (Dlopen and objc into NSFileManager). The test job above runs with
  # cgo, so this job runs the trash tests, including the trashItemAtURL round
  # trips, the way the shipped binary is built. No -race: it needs cgo. The job
  # has no path filter, so every change under internal/trash runs it.
  test-darwin-purego:
    name: Test purego (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is arm64; the Intel runner covers darwin/amd64.
        os: [macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test trash without cgo
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 -v ./internal/trash/...

  build:
    name: Cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build all release targets
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            echo "::group::$target"
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/brooom
            GOOS=${target%/*} GOARCH=${target#*/} go vet ./...
            echo "::endgroup::"
          done
