name: Diag
on:
  push:
    branches: [fix/114-unify-size-accounting-and-text]
permissions:
  contents: read
jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test
        shell: bash
        run: go test -count=1 ./internal/action ./internal/cli ./internal/config ./internal/catalog 2>&1 | grep -v "^ok" | head -150 || true
